[project]
name = "casi-manager"
version = "0.1.0"
description = "A manage system for CASI ( Centro Acadêmico de Sistemas de Informação)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openpyxl>=3.1.5",
    "pandas>=2.2.3",
    "pydantic>=2.11.2",
    "pydantic-settings>=2.8.1",
    "streamlit>=1.44.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "ruff>=0.11.4",
]
